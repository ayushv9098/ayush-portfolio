<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium Platinum Gradient for 'A' -->
    <linearGradient id="platA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="80%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    
    <!-- Darker Titanium Gradient for 'V' -->
    <linearGradient id="platV" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="512" height="512" rx="128" fill="#060608"/>
  
  <!-- Ultra-subtle inner border -->
  <rect x="6" y="6" width="500" height="500" rx="122" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <rect x="1" y="1" width="510" height="510" rx="127" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Monogram Group -->
  <g transform="translate(0, -10)" filter="url(#glow)">
    
    <!-- Letter 'V' (Placed in back so 'A' overlaps it) -->
    <path d="M190 190 L286 410 L382 190" 
          fill="none" 
          stroke="url(#platV)" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Letter 'A' (Overlaps 'V') -->
    <path d="M226 150 L130 370 M226 150 L322 370 M165 300 L287 300" 
          fill="none" 
          stroke="url(#platA)" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
  </g>
</svg>
